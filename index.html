<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPT-Live connection</title>
    <link rel="stylesheet" href="/vendor/pico/pico.min.css" />
    <style>
      .scroll-panel { max-height: 300px; overflow: auto; border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius); margin-top: 0.5rem; }
      .scroll-panel table { margin: 0; font-size: 0.85rem; }
      .scroll-panel th { position: sticky; top: 0; background: var(--pico-card-sectioning-background-color); z-index: 1; }
      .scroll-panel td, .scroll-panel th { padding: 0.35rem 0.75rem; }
      .chip { display: inline-block; background: var(--pico-primary-background); color: var(--pico-primary-inverse); border-radius: 1rem; padding: 0.1rem 0.7rem; margin: 0.15rem; font-size: 0.8rem; }
      .badge { display: inline-block; font-weight: 600; padding: 0.1rem 0.6rem; border-radius: var(--pico-border-radius); background: var(--pico-card-sectioning-background-color); margin-right: 0.5rem; }
      .badge.on { background: var(--pico-primary-background); color: var(--pico-primary-inverse); }
      .flash { animation: flash 0.8s ease-out; }
      @keyframes flash { from { box-shadow: 0 0 0 4px var(--pico-primary-focus); transform: scale(1.08); } to { box-shadow: 0 0 0 0 transparent; transform: scale(1); } }
      .controls { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
      .controls button, .controls input { width: auto; margin: 0; }
      audio { max-width: 100%; }
    </style>
  </head>
  <body>
    <main class="container"><h1>GPT-Live hospital assistant</h1></main>
    <script type="module">
      import autoAnimate from "/vendor/auto-animate/index.mjs";
      const start = document.createElement("button");
start.textContent = "Start conversation";
const stop = document.createElement("button");
stop.textContent = "End conversation";
stop.disabled = true;
const status = document.createElement("p");
const audio = new Audio();
audio.autoplay = true;
audio.controls = true;
const root = document.querySelector("main");
const card = (title, ...children) => {
  const article = document.createElement("article");
  const header = document.createElement("header");
  header.textContent = title;
  article.append(header, ...children);
  root.append(article);
  return article;
};
const controls = document.createElement("div");
controls.className = "controls";
controls.append(start, stop);
card("Conversation", controls, status, audio);

// ---- Live conversation state panels ----
const stateSection = document.createElement("div");
const stateSummary = document.createElement("p");
const countBadge = document.createElement("span");
countBadge.className = "badge";
const proposalBadge = document.createElement("span");
proposalBadge.className = "badge";
stateSummary.append(countBadge, proposalBadge);
const stateFilters = document.createElement("p");
const filtersLabel = document.createElement("span");
filtersLabel.textContent = "Active filters: ";
const filtersNone = document.createElement("em");
filtersNone.textContent = "none";
const chipBox = document.createElement("span");
stateFilters.append(filtersLabel, chipBox, filtersNone);
const stateRows = document.createElement("div");
stateRows.className = "scroll-panel";
stateSection.append(stateSummary, stateFilters, stateRows);
const stateCard = card("Conversation state", stateSection);
stateCard.hidden = true;
autoAnimate(chipBox);

function renderTable(container, columns, rows) {
  const table = document.createElement("table");
  const head = table.createTHead().insertRow();
  for (const column of columns) head.appendChild(document.createElement("th")).textContent = column;
  const body = table.createTBody();
  for (const row of rows) {
    const tr = body.insertRow();
    for (const column of columns) tr.insertCell().textContent = row[column];
  }
  container.replaceChildren(table);
}

const flash = (el) => {
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
};
const setText = (el, text) => {
  if (el.textContent !== text) {
    el.textContent = text;
    flash(el);
  }
};

// Keyed, incremental table so AutoAnimate sees rows leave/enter.
let rowBody, rowColumns = "", rowByKey = new Map();
function renderRows(columns, rows) {
  if (columns.join("\u0000") !== rowColumns) {
    rowColumns = columns.join("\u0000");
    rowByKey = new Map();
    const table = document.createElement("table");
    const head = table.createTHead().insertRow();
    for (const column of columns) head.appendChild(document.createElement("th")).textContent = column;
    rowBody = table.createTBody();
    autoAnimate(rowBody);
    stateRows.replaceChildren(table);
  }
  const keep = new Set();
  rows.forEach((row, i) => {
    const key = columns.map((c) => row[c]).join("\u0000");
    keep.add(key);
    let tr = rowByKey.get(key);
    if (!tr) {
      tr = document.createElement("tr");
      for (const column of columns) tr.insertCell().textContent = row[column];
      rowByKey.set(key, tr);
    }
    if (rowBody.children[i] !== tr) rowBody.insertBefore(tr, rowBody.children[i] ?? null);
  });
  for (const [key, tr] of rowByKey) {
    if (!keep.has(key)) {
      tr.remove();
      rowByKey.delete(key);
    }
  }
}

function renderState(state) {
  stateCard.hidden = false;
  setText(countBadge, `Remaining: ${state.count} / ${state.total}`);
  setText(proposalBadge, `proposalMade: ${state.proposalMade}`);
  proposalBadge.classList.toggle("on", state.proposalMade);
  const entries = Object.entries(state.filters);
  filtersNone.hidden = entries.length > 0;
  const want = new Map(entries.map(([c, v]) => [c, `${c}: ${v}`]));
  for (const chip of [...chipBox.children]) {
    if (want.get(chip.dataset.column) !== chip.textContent) chip.remove();
    else want.delete(chip.dataset.column);
  }
  for (const [column, text] of want) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.dataset.column = column;
    chip.textContent = text;
    chipBox.append(chip);
  }
  renderRows(state.columns, state.rows);
}

let peer;

let events;

let microphone;

let closeTimeout;
let ready = false;
let finalized = false;

// Live transcript: [{ role: "user" | "agent", text, startMs, endMs }]
let transcript = [];
let sessionId;
let settings;
let current; // { id, abort } for the latest delegation

function addTranscript(role, event) {
  const last = transcript.at(-1);
  if (last?.role === role) {
    last.text += event.delta;
    last.endMs = event.end_ms;
  } else {
    transcript.push({ role, text: event.delta, startMs: event.start_ms, endMs: event.end_ms });
  }
}

const post = (url, body) =>
  fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });

function sendCommentary(delegationId, content) {
  if (events?.readyState !== "open") return;
  events.send(
    JSON.stringify({
      type: "session.commentary.append",
      event_id: crypto.randomUUID(),
      delegation_id: delegationId,
      content,
    }),
  );
}

async function handleDelegation(id) {
  current?.abort.abort();
  const abort = new AbortController();
  current = { id, abort };
  const { transcriptTurns, settleWaitMs, acknowledgementDelayMs } = settings.delegation;
  if (acknowledgementDelayMs != null) {
    // Empty thinking append suppresses the automatic acknowledgment.
    events.send(
      JSON.stringify({
        type: "session.thinking.append",
        event_id: crypto.randomUUID(),
        delegation_id: id,
        content: "",
      }),
    );
  }
  await new Promise((r) => setTimeout(r, settleWaitMs));
  if (current.id !== id) return;
  const turns = transcript
    .filter((t) => t.text.trim())
    .map((t) => ({ role: t.role, text: t.text.trim() }))
    .slice(transcriptTurns == null ? 0 : -transcriptTurns);
  if (!turns.some((t) => t.role === "user")) return;
  try {
    const response = await post("/api/delegate", { sessionId, transcript: turns });
    abort.signal.addEventListener("abort", () => response.body?.cancel());
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let sse = "";
    let pending = "";
    let endAfter = false;
    let endAudio;
    const flush = () => {
      const parts = pending.split(/(?<=[.!?])\s+/);
      pending = parts.pop();
      for (const part of parts) {
        if (part.trim() && current?.id === id) sendCommentary(id, part.trim());
      }
    };
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      sse += decoder.decode(value, { stream: true });
      const frames = sse.split("\n\n");
      sse = frames.pop();
      for (const frame of frames) {
        const data = frame.match(/^data: (.*)$/m)?.[1];
        if (frame.startsWith("event: end")) {
          endAfter = true;
          endAudio = JSON.parse(data).audio;
        }
        else if (frame.startsWith("event: state")) renderState(JSON.parse(data));
        else if (frame.startsWith("event: error")) console.error("Delegation error", data);
        else if (data && !frame.startsWith("event: done")) {
          pending += JSON.parse(data).text ?? "";
          flush();
        }
      }
    }
    pending = pending.trim();
    if (pending && current?.id === id) sendCommentary(id, pending);
    // Proposal accepted: play the clip separately from the voice agent, then end the call.
    if (endAfter && current?.id === id) {
      if (endAudio) new Audio("/" + endAudio).play().catch((e) => console.error("Clip failed", e));
      stop.click();
    }
  } catch (error) {
    if (!abort.signal.aborted) console.error("Delegation failed", error);
  }
}

function cleanup() {
  clearTimeout(closeTimeout);
  microphone?.getTracks().forEach((track) => track.stop());
  const closingEvents = events;
  events = undefined;
  closingEvents?.close();
  peer?.close();
  audio.srcObject = null;
  ready = false;
  start.disabled = false;
  stop.disabled = true;
}

start.addEventListener("click", async () => {
  start.disabled = true;
  finalized = false;
  status.textContent = "Connecting…";
  transcript = [];
  try {
    settings = await (await fetch("/api/settings")).json();
    const connection = new RTCPeerConnection();
    peer = connection;
    connection.addEventListener("track", (event) => {
      audio.srcObject = new MediaStream([event.track]);
      audio.play().catch(() => {
        status.textContent =
          "Select play on the audio controls to hear the assistant.";
      });
    });
    microphone = await navigator.mediaDevices.getUserMedia({ audio: true });
    for (const track of microphone.getAudioTracks()) {
      connection.addTrack(track, microphone);
    }

    // Create the event channel before creating the SDP offer.
    events = connection.createDataChannel("oai-events");
    events.addEventListener("message", ({ data }) => {
      const event = JSON.parse(data);
      if (event.type === "session.started") {
        sessionId = event.session.id;
        ready = true;
        post("/api/conversation/start", { sessionId })
          .then((r) => r.json())
          .then((j) => renderState(j.state))
          .catch(console.error);
        stop.disabled = false;
        status.textContent = "Connected: " + event.session.id;
      } else if (event.type === "session.closed") {
        finalized = true;
        console.log("Final session usage", event.usage);
        if (sessionId && transcript.length) {
          post("/api/transcript", { sessionId, turns: transcript }).catch(console.error);
        }
        status.textContent = "Conversation ended.";
        cleanup();
      } else if (event.type === "session.input_transcript.delta") {
        addTranscript("user", event);
      } else if (event.type === "session.output_transcript.delta") {
        addTranscript("agent", event);
      } else if (event.type === "session.delegation.created") {
        handleDelegation(event.delegation.id);
      } else {
        // Save transcript and nested Responses events as needed by your app.
        console.log(event);
      }
    });
    events.addEventListener("close", (event) => {
      if (event.target !== events) return;
      if (!finalized) {
        status.textContent = "Disconnected without final session usage.";
        cleanup();
      }
    });

    const offer = await connection.createOffer();
    await connection.setLocalDescription(offer);
    if (connection.iceGatheringState !== "complete") {
      await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => {
          connection.removeEventListener("icegatheringstatechange", onState);
          reject(new Error("Timed out while gathering ICE candidates"));
        }, 10_000);
        function onState() {
          if (connection.iceGatheringState !== "complete") return;
          clearTimeout(timeout);
          connection.removeEventListener("icegatheringstatechange", onState);
          resolve(undefined);
        }
        connection.addEventListener("icegatheringstatechange", onState);
        onState();
      });
    }

    const sdp = connection.localDescription?.sdp;
    if (!sdp) throw new Error("Missing local SDP offer");
    const response = await fetch("/api/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sdp }),
    });
    if (!response.ok) throw new Error(await response.text());

    const result = await response.json();
    console.log("Created session", result.session.id);
    await connection.setRemoteDescription({
      type: "answer",
      sdp: result.transport.sdp,
    });
    // The HTTP request started this session. Do not send session.start here.
  } catch (error) {
    status.textContent =
      error instanceof Error ? error.message : String(error);
    cleanup();
  }
});

stop.addEventListener("click", () => {
  if (!ready || !events || events.readyState !== "open") return;
  stop.disabled = true;
  status.textContent = "Finishing the conversation…";
  // The session.closed handler is already registered. Keep media and events
  // alive while pending work drains; only clean up after the final event.
  events.send(JSON.stringify({ type: "session.close" }));
  closeTimeout = setTimeout(() => {
    status.textContent = "Incomplete finalization: no session.closed event.";
    cleanup();
  }, 15_000);
});

// ---- Hospitals CSV upload + preview ----
const fileInput = document.createElement("input");
fileInput.type = "file";
fileInput.accept = ".csv,text/csv";
const upload = document.createElement("button");
upload.textContent = "Upload CSV (replaces table)";
const uploadStatus = document.createElement("p");
const panel = document.createElement("div");
panel.id = "hospitals-panel";
panel.className = "scroll-panel";
panel.hidden = true;
const csvControls = document.createElement("div");
csvControls.className = "controls";
csvControls.append(fileInput, upload);
card("Hospitals CSV", csvControls, uploadStatus, panel);

async function refreshHospitals() {
  const response = await fetch("/api/hospitals");
  if (response.status === 204 || !response.ok) {
    panel.hidden = true;
    panel.replaceChildren();
    return;
  }
  const { columns, rows } = await response.json();
  renderTable(panel, columns, rows);
  panel.hidden = false;
  uploadStatus.textContent = uploadStatus.textContent || rows.length + " rows";
}

upload.addEventListener("click", async () => {
  const file = fileInput.files[0];
  if (!file) {
    uploadStatus.textContent = "Choose a CSV file first.";
    return;
  }
  if (!confirm("This replaces the entire hospitals table. Continue?")) return;
  uploadStatus.textContent = "Uploading…";
  try {
    const response = await fetch("/api/hospitals", {
      method: "POST",
      headers: { "Content-Type": "text/csv" },
      body: await file.text(),
    });
    if (!response.ok) {
      const message = await response.json().then((j) => j.error, () => response.statusText);
      throw new Error(message);
    }
    const { count } = await response.json();
    uploadStatus.textContent = "Uploaded " + count + " rows.";
    await refreshHospitals();
  } catch (error) {
    uploadStatus.textContent = "Upload failed: " + (error instanceof Error ? error.message : error);
  }
});

refreshHospitals().catch(console.error);
    </script>
  </body>
</html>
